name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generated types are current (wrangler types)
        run: npm run types && git diff --exit-code worker-configuration.d.ts
      - run: npm run lint
      - name: Type-check (Worker in TS, browser JS via JSDoc)
        run: npm run check-types
      - run: npm test
      - name: Size budgets (budgets.json)
        run: npm run budgets
      - name: Bundle check (no deploy)
        run: npx wrangler deploy --dry-run --outdir .wrangler/dry-run
      - name: Package works when installed (CLI from node_modules, site bundles from the package)
        run: |
          npm pack -w @contentworker/frontend --pack-destination "$RUNNER_TEMP"
          site="$RUNNER_TEMP/probe-site" && mkdir -p "$site" && cd "$site"
          echo '{ "name": "probe-site", "private": true, "type": "module" }' > package.json
          npm install --no-audit --no-fund "$RUNNER_TEMP"/contentworker-frontend-*.tgz
          printf '{\n  "name": "probe-site",\n  "main": "node_modules/@contentworker/frontend/src/entry.ts"\n}\n' > wrangler.jsonc
          npx --no-install contentworker-site new-block probe --js
          test -f src/worker.ts && test -f public/blocks/probe/probe.css
          npx --no-install esbuild src/worker.ts --bundle --format=esm --platform=neutral --external:cloudflare:workers --main-fields=module,main --outfile=out.js
      - name: npm create @contentworker/site writes a site that bundles (packed, as npm runs it)
        run: |
          npm pack -w @contentworker/create-site --pack-destination "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          npx --yes --package ./contentworker-create-site-*.tgz create-site created-site -- --yes --no-install \
            --delivery https://cdn.example.com/my-space/main --key probe
          cd created-site
          test -f wrangler.jsonc && test -f public/styles/site.css && grep -q '^CONTENTWORKER_KEY=probe$' .dev.vars
          # The runtime from this commit, not npm's, so a new runtime version is tested before it ships.
          npm install --no-audit --no-fund "$RUNNER_TEMP"/contentworker-frontend-*.tgz
          npx --no-install wrangler deploy --dry-run --outdir dist

  # Every page must score 100 in performance, accessibility, best practices and SEO, on mobile
  # and desktop (Lighthouse 13, as PageSpeed Insights runs it), or the PR fails. Measures the real
  # site Worker under wrangler dev against the mock Delivery API, so it's deterministic.
  lighthouse:
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lighthouse gate (100 on every page, mobile and desktop)
        run: npm run lighthouse
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lighthouse-summary
          path: .wrangler/lighthouse-summary.md
